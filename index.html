<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Journal - 旅の記録</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .rating-star { cursor: pointer; transition: color 0.2s; }
    .rating-star:hover, .rating-star.active { color: #f59e0b; }
    .spot-card { border-left: 4px solid #3b82f6; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-plane-departure"></i> Travel Journal
      </h1>
      <button id="open-modal-btn" class="bg-amber-400 hover:bg-amber-300 text-indigo-900 font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> 新しい旅行を記録
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Stats Banner -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="bg-indigo-100 p-3 rounded-full text-indigo-600 text-xl"><i class="fa-solid fa-map-location-dot"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">総旅行数</p>
          <p id="stat-total-trips" class="text-2xl font-black text-slate-800">0</p>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="bg-emerald-100 p-3 rounded-full text-emerald-600 text-xl"><i class="fa-solid fa-location-dot"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">訪問スポット数</p>
          <p id="stat-total-spots" class="text-2xl font-black text-slate-800">0</p>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="bg-amber-100 p-3 rounded-full text-amber-600 text-xl"><i class="fa-solid fa-star"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">平均満足度</p>
          <p id="stat-avg-rating" class="text-2xl font-black text-slate-800">0.0</p>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="bg-rose-100 p-3 rounded-full text-rose-600 text-xl"><i class="fa-solid fa-camera"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-bold uppercase">写真数</p>
          <p id="stat-total-photos" class="text-2xl font-black text-slate-800">0</p>
        </div>
      </div>
    </section>

    <!-- Search & Filter Bar -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="search-input" placeholder="タイトル、目的地、スポット名で検索..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </section>

    <!-- Trips Grid -->
    <section>
      <h2 class="text-xl font-bold mb-4 text-slate-700">旅行一覧</h2>
      <div id="trips-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JSで旅行カードを動的生成 -->
      </div>
    </section>
  </main>

  <!-- Create/Edit Modal -->
  <div id="trip-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col my-8">
      <div class="p-6 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10">
        <h3 id="modal-title" class="text-xl font-bold text-slate-800">新しい旅行の記録</h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form id="trip-form" class="p-6 overflow-y-auto space-y-6">
        <!-- 基本情報 -->
        <div class="space-y-4">
          <h4 class="font-bold text-indigo-600 border-b pb-1"><i class="fa-solid fa-circle-info"></i> 基本情報</h4>
          <div>
            <label class="block text-sm font-semibold mb-1">旅行タイトル *</label>
            <input type="text" id="trip-title" required placeholder="例: 京都・嵐山もみじ狩り旅行" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">目的地 *</label>
              <input type="text" id="trip-destination" required placeholder="例: 京都府京都市" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">旅行日 *</label>
              <input type="date" id="trip-date" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">全体の感想・メモ</label>
            <textarea id="trip-notes" rows="3" placeholder="旅行全体の思い出や感想を入力..." class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">表紙写真</label>
            <input type="file" id="trip-photo" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          </div>
        </div>

        <!-- スポット・お店の記録 -->
        <div class="space-y-4 border-t border-slate-200 pt-4">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-indigo-600"><i class="fa-solid fa-utensils"></i> 訪れたスポット・お店・ホテルの個別評価</h4>
            <button type="button" id="add-spot-btn" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 transition">
              <i class="fa-solid fa-plus"></i> スポットを追加
            </button>
          </div>

          <div id="spots-form-container" class="space-y-4">
            <!-- 動的にスポット入力フォームを追加 -->
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
          <button type="button" id="cancel-btn" class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 font-semibold hover:bg-slate-100">キャンセル</button>
          <button type="submit" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 shadow-md">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto my-8">
      <div id="detail-content" class="p-6 space-y-6">
        <!-- JSで詳細内容を表示 -->
      </div>
      <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-3 rounded-b-2xl">
        <button id="close-detail-btn" class="px-5 py-2 rounded-lg bg-slate-2
